<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Our Doctors | Medicus</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/css/style.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">

</head>

<body class="doctors-page-body">
<!-- Navbar -->
<site-nav></site-nav>

<!-- Header -->
  <header class="page-hero">
    <div class="page-hero-glow" aria-hidden="true"></div>
      <!--EEG line -->
    <svg class="page-hero-pulse" viewBox="0 0 1200 100" preserveAspectRatio="none" aria-hidden="true">
      <path d="M0,50 L300,50 L330,15 L360,85 L390,50 L420,50 L450,30 L480,70 L510,50 L1200,50" />
    </svg>
    <div class="container position-relative">
      <!-- Breadcrumb -->
      <nav class="hero-breadcrumb" aria-label="breadcrumb">
        <a href="index.html">Home</a>
        <span class="sep">&rsaquo;</span>
        <span class="current">Doctors</span>
      </nav>
      <!-- Eyebrow / small tag-->
      <span class="hero-eyebrow">
        <i class="fa-solid fa-user-doctor"></i> Expert Medical Team </span>
      <!-- title & description-->
      <h1 class="hero-title">Meet Our <span>Doctors</span></h1>
      <p class="hero-text">Board-certified specialists dedicated to taking care of you and your family.</p>
    </div>
  </header>

<div class="container my-5">
  <div class="row">

    <aside class="col-lg-3 mb-4 mb-lg-0 sidebar-col">
      <div class="services-sidebar">
        <p class="sidebar-label">Search</p>
        <div class="mb-4" id="searchWrapSmall">
          <input type="search" id="doctorSearch" class="form-control" placeholder="Search by name...">
        </div>

        <button type="button"
                class="category-toggle d-lg-none"
                data-bs-toggle="collapse"
                data-bs-target="#departmentFilters"
                aria-expanded="false"
                aria-controls="departmentFilters">
          <span>Filter by Department</span>
          <i class="bi bi-chevron-down"></i>
        </button>

        <p class="sidebar-label d-none d-lg-block">Departments</p>

        <div class="category-filters collapse" id="departmentFilters">
          <!-- filled by JS -->
        </div>
      </div>
    </aside>

    <div class="col-lg-9 services-main-panel">
      <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
        <span id="resultsCount"></span>
        <select id="sortSelect" class="form-select form-select-sm" style="width:auto;">
          <option value="name">Sort: Name (A–Z)</option>
          <option value="rating">Sort: Highest Rated</option>
          <option value="reviews">Sort: Most Reviewed</option>
        </select>
      </div>

      <div class="row g-4" id="doctorsGrid">
        <!-- Doctor cards get rendered here by JS -->
      </div>

      <p id="noResults" class="services-empty d-none">
        No doctors match your search.
      </p>
    </div>

  </div>
</div>

<!-- Site footer -->
<site-footer></site-footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/main.js"></script>
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  <script type="module" src="assets/js/service-detail.js"></script>
  <script type="module" src="assets/js/doctors.js"></script>
</body>
</html>
